<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>DocTrack Pro - บันทึกค่าเที่ยวแผนกส่งเอกสาร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- นำเข้าไลบรารี html2pdf สำหรับแปลงหน้าเว็บเป็นเอกสาร PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #FFF8EE;
            color: #333333;
        }

        .header-bg {
            background: linear-gradient(180deg, #FFB03A 0%, #FF9800 100%);
        }

        .tag-btn {
            background-color: #FFF3E0;
            color: #E65100;
            border: 1px solid #FFE0B2;
            transition: all 0.2s;
        }
        .tag-btn:active {
            background-color: #FFE0B2;
            transform: scale(0.95);
        }

        /* สไตล์ตารางรายงานแบบกะทัดรัดตามตัวอย่าง */
        .report-table-container {
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            background: #ffffff;
            padding: 15px;
            border: 1px solid #d1d5db;
        }

        .custom-report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        .custom-report-table th, .custom-report-table td {
            border: 1px solid #d1d5db;
            padding: 4px 6px;
            vertical-align: middle;
        }

        .custom-report-table th {
            background-color: #f3f4f6;
            text-align: center;
            font-weight: bold;
        }

        /* CSS สำหรับการพิมพ์ */
        @media print {
            body * {
                visibility: hidden;
            }
            #report-export-area, #report-export-area * {
                visibility: visible;
            }
            #report-export-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                max-width: 100% !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Header -->
    <header class="header-bg no-print p-4 text-center rounded-b-3xl shadow-md sticky top-0 z-10">
        <div class="inline-block bg-white/20 px-6 py-1.5 rounded-full text-white font-bold text-lg backdrop-blur-sm shadow-inner">
            บันทึกค่าเที่ยวแผนกส่งเอกสาร
        </div>
        
        <!-- ปุ่มเลือกชื่อผู้ใช้ -->
        <div class="mt-3 flex justify-center gap-2 flex-wrap">
            <button onclick="setUser('นายโอภาส')" class="user-btn px-4 py-1 rounded-full text-xs font-semibold bg-white text-orange-600 shadow-sm">นายโอภาส</button>
            <button onclick="setUser('นายนรินทร์')" class="user-btn px-4 py-1 rounded-full text-xs font-semibold bg-white/40 text-white">นายนรินทร์</button>
            <button onclick="setUser('นายเจริญชัย')" class="user-btn px-4 py-1 rounded-full text-xs font-semibold bg-white/40 text-white">นายเจริญชัย</button>
            <button onclick="setUser('นายต้น')" class="user-btn px-4 py-1 rounded-full text-xs font-semibold bg-white/40 text-white">นายต้น</button>
        </div>
    </header>

    <!-- ปุ่มสลับแท็บ -->
    <div class="max-w-md mx-auto p-4 no-print">
        <div class="flex bg-white rounded-full p-1 shadow-sm mb-4">
            <button id="tab-form-btn" onclick="switchTab('form')" class="flex-1 py-2 rounded-full text-sm font-bold text-white bg-orange-500 shadow-md transition-all">
                ✏️ ลงงาน
            </button>
            <button id="tab-report-btn" onclick="switchTab('report')" class="flex-1 py-2 rounded-full text-sm font-bold text-gray-500 transition-all">
                📄 รายงาน
            </button>
        </div>
    </div>

    <!-- ส่วนเนื้อหาหลัก -->
    <main class="max-w-md mx-auto px-4">

        <!-- แท็บ 1: หน้าลงงาน -->
        <div id="tab-form" class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
            <div class="mb-4">
                <span class="text-xs text-gray-400 font-semibold block">กำลังลงงานให้:</span>
                <span id="form-user-title" class="text-xl font-bold text-gray-800">นายโอภาส</span>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">วันที่ทำงาน</label>
                    <input type="date" id="input-date" class="w-full p-3 bg-gray-50 rounded-xl border-0 text-sm focus:ring-2 focus:ring-orange-400 outline-none">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-bold text-gray-500">ชื่องาน / สถานที่</label>
                        <span class="text-[10px] text-orange-500 font-semibold">📍 เลือกด่วนจากประวัติ</span>
                    </div>
                    <input type="text" id="input-location" placeholder="เช่น ธนาคารกสิกร, ไปรษณีย์" class="w-full p-3 bg-gray-50 rounded-xl border-0 text-sm focus:ring-2 focus:ring-orange-400 outline-none">
                    
                    <div id="dynamic-tags-container" class="flex flex-wrap gap-1.5 mt-2"></div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">เวลาเริ่ม</label>
                        <input type="time" id="input-time-start" class="w-full p-3 bg-gray-50 rounded-xl border-0 text-sm focus:ring-2 focus:ring-orange-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">เวลาจบ</label>
                        <input type="time" id="input-time-end" class="w-full p-3 bg-gray-50 rounded-xl border-0 text-sm focus:ring-2 focus:ring-orange-400 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">จำนวนเงิน (บาท)</label>
                    <input type="number" id="input-amount" placeholder="0" class="w-full p-3 bg-gray-50 rounded-xl border-0 text-sm text-center font-bold text-lg focus:ring-2 focus:ring-orange-400 outline-none">
                    
                    <div class="grid grid-cols-6 gap-1.5 mt-2 text-center">
                        <button type="button" onclick="setAmount(20)" class="bg-amber-50 text-amber-800 text-xs py-1.5 rounded-lg border border-amber-200 font-semibold active:bg-amber-200">20.-</button>
                        <button type="button" onclick="setAmount(40)" class="bg-amber-50 text-amber-800 text-xs py-1.5 rounded-lg border border-amber-200 font-semibold active:bg-amber-200">40.-</button>
                        <button type="button" onclick="setAmount(60)" class="bg-amber-50 text-amber-800 text-xs py-1.5 rounded-lg border border-amber-200 font-semibold active:bg-amber-200">60.-</button>
                        <button type="button" onclick="setAmount(100)" class="bg-amber-50 text-amber-800 text-xs py-1.5 rounded-lg border border-amber-200 font-semibold active:bg-amber-200">100.-</button>
                        <button type="button" onclick="setAmount(120)" class="bg-amber-50 text-amber-800 text-xs py-1.5 rounded-lg border border-amber-200 font-semibold active:bg-amber-200">120.-</button>
                        <button type="button" onclick="setAmount(140)" class="bg-amber-50 text-amber-800 text-xs py-1.5 rounded-lg border border-amber-200 font-semibold active:bg-amber-200">140.-</button>
                    </div>
                </div>

                <button type="button" onclick="saveRecord()" class="w-full py-3.5 bg-gradient-to-r from-orange-400 to-amber-500 text-white font-bold rounded-2xl shadow-md hover:opacity-95 active:scale-98 transition-all mt-2">
                    บันทึกรายการ
                </button>
            </div>
        </div>

        <!-- แท็บ 2: หน้ารายงาน & ปุ่มสั่งพิมพ์ / ดาวน์โหลด PDF -->
        <div id="tab-report" class="hidden">
            <div class="no-print mb-4 bg-white p-3 rounded-2xl shadow-sm border border-gray-100 space-y-2">
                <div class="text-sm font-bold text-gray-700 flex justify-between items-center">
                    <span>ชื่อ: <span id="report-user-name" class="text-orange-600">นายโอภาส</span></span>
                </div>
                
                <!-- ปุ่มสั่งงาน -->
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="printReport()" class="bg-emerald-600 active:bg-emerald-700 text-white text-xs py-2.5 rounded-xl font-bold flex justify-center items-center gap-1 shadow-sm transition-all">
                        🖨️ พิมพ์รายงานทันที
                    </button>
                    <button type="button" id="export-pdf-btn" onclick="exportToPDF()" class="bg-gray-800 active:bg-black text-white text-xs py-2.5 rounded-xl font-bold flex justify-center items-center gap-1 shadow-sm transition-all">
                        📄 ดาวน์โหลด PDF
                    </button>
                </div>
            </div>

            <!-- ส่วนควบคุมเฉพาะ Admin -->
            <div id="admin-reset-container" class="no-print mb-4 p-3 bg-red-50 border border-red-200 rounded-2xl flex justify-between items-center hidden">
                <div class="text-xs text-red-700">
                    <span class="font-bold block">⚙️ จัดการข้อมูลรอบเดือน</span>
                    <span class="text-[10px] text-red-500">รอบวันที่ 24 ถึง 23 ของทุกเดือน</span>
                </div>
                <button type="button" onclick="resetMonthlyData()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold shadow-sm active:scale-95 transition-all">
                    🔴 รีเซ็ตทั้งหมด
                </button>
            </div>

            <!-- โซนรายงานแบบตาราง -->
            <div id="report-export-area" class="report-table-container">
                <div class="text-center mb-3 pb-2 border-b border-gray-400">
                    <h1 class="text-sm font-bold text-gray-900">บันทึกใบวิ่งงานและสรุปค่าเที่ยว แผนกส่งเอกสาร</h1>
                    <div class="flex justify-between text-[11px] text-gray-600 mt-1 px-1">
                        <span>ชื่อผู้ปฏิบัติงาน: <span id="print-user-name">นายโอภาส</span></span>
                        <span id="print-cycle-text">รอบงาน 24/08/69 - 23/09/69</span>
                    </div>
                </div>

                <div id="report-list-container"></div>
            </div>
        </div>

    </main>

    <script>
        const ADMIN_USER = 'นายโอภาส'; 
        let currentUser = 'นายโอภาส';
        const defaultTags = ['สามแยก', 'ไปรษณีย์', 'ปากคลองตลาด', 'กรุ๊ป', 'สรรพากร', 'ร้านเป็ดเล็ก', 'สะพานพุทธ', 'ขนมหวาน', 'ร้านหมูทอง (ตึกเก่า)', 'ประตูน้ำ'];

        document.getElementById('input-date').valueAsDate = new Date();

        function getRecords() {
            return JSON.parse(localStorage.getItem('doc_track_records') || '[]');
        }

        function saveRecords(data) {
            localStorage.setItem('doc_track_records', JSON.stringify(data));
        }

        function renderDynamicTags() {
            const records = getRecords().filter(r => r.user === currentUser);
            const container = document.getElementById('dynamic-tags-container');
            container.innerHTML = '';

            const tagStats = {};
            defaultTags.forEach((tag, index) => {
                tagStats[tag] = { count: 1, lastUsed: index };
            });

            records.forEach(r => {
                if (r.location) {
                    const places = r.location.split(',').map(p => p.trim());
                    places.forEach(p => {
                        if (p) {
                            if (!tagStats[p]) {
                                tagStats[p] = { count: 1, lastUsed: r.id };
                            } else {
                                tagStats[p].count += 1;
                                tagStats[p].lastUsed = Math.max(tagStats[p].lastUsed, r.id);
                            }
                        }
                    });
                }
            });

            const sortedTags = Object.keys(tagStats).sort((a, b) => {
                if (tagStats[b].lastUsed !== tagStats[a].lastUsed) {
                    return tagStats[b].lastUsed - tagStats[a].lastUsed;
                }
                return tagStats[b].count - tagStats[a].count;
            });

            sortedTags.slice(0, 10).forEach(tag => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tag-btn text-xs px-2.5 py-1 rounded-full';
                btn.innerText = tag;
                btn.onclick = () => addTag(tag);
                container.appendChild(btn);
            });
        }

        function setUser(name) {
            currentUser = name;
            document.getElementById('form-user-title').innerText = name;
            document.getElementById('report-user-name').innerText = name;
            document.getElementById('print-user-name').innerText = name;
            
            document.querySelectorAll('.user-btn').forEach(btn => {
                if(btn.innerText === name) {
                    btn.className = "user-btn px-4 py-1 rounded-full text-xs font-semibold bg-white text-orange-600 shadow-sm";
                } else {
                    btn.className = "user-btn px-4 py-1 rounded-full text-xs font-semibold bg-white/40 text-white";
                }
            });

            const adminContainer = document.getElementById('admin-reset-container');
            if (currentUser === ADMIN_USER) {
                adminContainer.classList.remove('hidden');
            } else {
                adminContainer.classList.add('hidden');
            }

            renderDynamicTags();
            renderReport();
        }

        function switchTab(tab) {
            const formTab = document.getElementById('tab-form');
            const reportTab = document.getElementById('tab-report');
            const formBtn = document.getElementById('tab-form-btn');
            const reportBtn = document.getElementById('tab-report-btn');

            if (tab === 'form') {
                formTab.classList.remove('hidden');
                reportTab.classList.add('hidden');
                formBtn.className = "flex-1 py-2 rounded-full text-sm font-bold text-white bg-orange-500 shadow-md transition-all";
                reportBtn.className = "flex-1 py-2 rounded-full text-sm font-bold text-gray-500 transition-all";
                renderDynamicTags();
            } else {
                formTab.classList.add('hidden');
                reportTab.classList.remove('hidden');
                reportBtn.className = "flex-1 py-2 rounded-full text-sm font-bold text-white bg-orange-500 shadow-md transition-all";
                formBtn.className = "flex-1 py-2 rounded-full text-sm font-bold text-gray-500 transition-all";
                renderReport();
            }
        }

        function addTag(text) {
            const input = document.getElementById('input-location');
            input.value = input.value ? input.value + ', ' + text : text;
        }

        function setAmount(val) {
            document.getElementById('input-amount').value = val;
        }

        function saveRecord() {
            const dateVal = document.getElementById('input-date').value;
            const locationVal = document.getElementById('input-location').value.trim();
            const timeStart = document.getElementById('input-time-start').value;
            const timeEnd = document.getElementById('input-time-end').value;
            const amountVal = document.getElementById('input-amount').value;

            if (!dateVal || !locationVal || !amountVal) {
                alert('กรุณากรอกวันที่ ชื่องาน/สถานที่ และจำนวนเงินให้ครบถ้วนครับ');
                return;
            }

            const d = new Date(dateVal);
            const formattedDate = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getFullYear() + 543).slice(-2)}`;

            let timeStr = '';
            if (timeStart && timeEnd) timeStr = `${timeStart}-${timeEnd} น.`;
            else if (timeStart) timeStr = `${timeStart} น.`;

            const records = getRecords();
            records.push({
                id: Date.now(),
                user: currentUser,
                date: formattedDate,
                rawDate: dateVal,
                location: locationVal,
                time: timeStr,
                amount: parseFloat(amountVal)
            });
            saveRecords(records);

            alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
            document.getElementById('input-location').value = '';
            document.getElementById('input-time-start').value = '';
            document.getElementById('input-time-end').value = '';
            document.getElementById('input-amount').value = '';
            renderDynamicTags();
        }

        function deleteRecord(id) {
            if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
                let records = getRecords().filter(r => r.id !== id);
                saveRecords(records);
                renderReport();
                renderDynamicTags();
            }
        }

        function resetMonthlyData() {
            if (confirm(`⚠️ ยืนยันการรีเซ็ตข้อมูลทั้งหมดของทุกคนใช่หรือไม่?\n\nการกดปุ่มนี้จะลบรายการบันทึกของทุกคนในระบบเพื่อเริ่มรอบเดือนใหม่ (24-23) และไม่สามารถกู้คืนได้!`)) {
                saveRecords([]);
                alert(`ล้างข้อมูลทั้งหมดของทุกคนเรียบร้อยแล้ว พร้อมเริ่มรอบเดือนใหม่ครับ!`);
                renderReport();
                renderDynamicTags();
            }
        }

        function updateCycleText() {
            const now = new Date();
            let y = now.getFullYear();
            let m = now.getMonth();
            let startD, endD;
            if (now.getDate() >= 24) {
                startD = new Date(y, m, 24);
                endD = new Date(y, m + 1, 23);
            } else {
                startD = new Date(y, m - 1, 24);
                endD = new Date(y, m, 23);
            }
            const fmt = (d) => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getFullYear() + 543).slice(-2)}`;
            document.getElementById('print-cycle-text').innerText = `รอบงาน ${fmt(startD)} - ${fmt(endD)}`;
        }

        function printReport() {
            const isLine = navigator.userAgent.indexOf('Line') > -1;
            if (isLine) {
                alert('โปรดเปิดลิงก์นี้ในเบราว์เซอร์ Chrome หรือ Safari (กดจุด 3 จุดมุมขวาบน -> เลือก Open in Chrome/Safari) เพื่อให้ระบบสั่งพิมพ์ทำงานได้อย่างสมบูรณ์ครับ');
            }
            window.print();
        }

        function exportToPDF() {
            const btn = document.getElementById('export-pdf-btn');
            btn.innerText = '⏳ กำลังสร้าง...';
            btn.disabled = true;

            const deleteBtns = document.querySelectorAll('.delete-btn');
            deleteBtns.forEach(b => b.style.display = 'none');

            const element = document.getElementById('report-export-area');

            const opt = {
                margin:       [15, 10, 15, 10],
                filename:     `รายงานค่าเที่ยว_${currentUser}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                deleteBtns.forEach(b => b.style.display = 'inline-block');
                btn.innerText = '📄 ดาวน์โหลด PDF';
                btn.disabled = false;
            }).catch(err => {
                deleteBtns.forEach(b => b.style.display = 'inline-block');
                btn.innerText = '📄 ดาวน์โหลด PDF';
                btn.disabled = false;
                alert('เกิดข้อผิดพลาดในการสร้าง PDF');
            });
        }

        function renderReport() {
            const container = document.getElementById('report-list-container');
            container.innerHTML = '';

            let records = getRecords().filter(r => r.user === currentUser);

            if (records.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs font-medium">ยังไม่มีข้อมูลการลงงานของ ${currentUser}</div>`;
                return;
            }

            records.sort((a, b) => (a.rawDate && b.rawDate) ? a.rawDate.localeCompare(b.rawDate) : 0);
            updateCycleText();

            const grouped = {};
            let grandTotal = 0;

            records.forEach(r => {
                if (!grouped[r.date]) grouped[r.date] = [];
                grouped[r.date].push(r);
                grandTotal += r.amount;
            });

            let tableHTML = `<table class="custom-report-table">`;
            
            for (const dateStr in grouped) {
                const dayItems = grouped[dateStr];
                let dayTotal = 0;

                dayItems.forEach((item, index) => {
                    dayTotal += item.amount;
                    tableHTML += `<tr>`;
                    
                    // แสดงวันที่เฉพาะแถวแรกของวันนั้นๆ แถวที่เหลือปล่อยว่าง
                    if (index === 0) {
                        tableHTML += `<td style="width: 18%; text-align: center; font-weight: bold; background-color: #fafafa;">${dateStr}</td>`;
                    } else {
                        tableHTML += `<td style="width: 18%; background-color: #ffffff;"></td>`;
                    }

                    tableHTML += `
                        <td style="width: 42%;">${index + 1}. ${item.location}</td>
                        <td style="width: 25%; text-align: center; color: #555;">${item.time || '-'}</td>
                        <td style="width: 15%; text-align: right;">
                            ${item.amount}.- 
                            <button type="button" onclick="deleteRecord(${item.id})" class="delete-btn text-red-500 font-bold px-1 no-print" style="margin-left: 4px;">✕</button>
                        </td>
                    `;
                    tableHTML += `</tr>`;
                });

                // แถวสรุปยอดรวมประจำวัน (TOTAL)
                tableHTML += `
                    <tr style="background-color: #f3f4f6; font-weight: bold;">
                        <td style="background-color: #f3f4f6;"></td>
                        <td colspan="2">TOTAL</td>
                        <td style="text-align: right;">${dayTotal}.-</td>
                    </tr>
                `;
            }

            // แถวสรุปยอดรวมทั้งหมด (TOTAL รวมทั้งหมด)
            tableHTML += `
                <tr style="background-color: #e5e7eb; font-weight: bold; font-size: 12px;">
                    <td colspan="3" style="text-align: left;">TOTAL รวมทั้งหมด</td>
                    <td style="text-align: right;">${grandTotal.toLocaleString()}.-</td>
                </tr>
            `;

            tableHTML += `</table>`;
            container.innerHTML = tableHTML;
        }

        setUser(currentUser);
    </script>
</body>
</html>
