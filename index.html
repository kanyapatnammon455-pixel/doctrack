<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocTrack Pro - บันทึกงานส่งเอกสาร</title>
    <!-- โหลด html2pdf.js สำหรับดาวน์โหลด PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { background-color: #fffbf0; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { background: #ff9800; color: white; text-align: center; padding: 12px; border-radius: 20px; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; }
        
        .user-box { background: #fff8e1; border: 1px solid #ffe0b2; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .user-btns { display: flex; gap: 8px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
        .btn-user { padding: 6px 16px; border: none; border-radius: 15px; background: #e0e0e0; cursor: pointer; }
        .btn-user.active { background: #ff6f00; color: white; font-weight: bold; }
        
        .tab-btns { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-tab { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #e0e0e0; font-weight: bold; cursor: pointer; }
        .btn-tab.active { background: #ff6f00; color: white; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        .btn-submit { width: 100%; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .action-bar { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-action { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; color: white; }
        .btn-print { background: #333; }
        .btn-clear-all { background: #e53935; }
        
        /* จัดรูปแบบรายงาน A4 */
        .report-page { background: white; padding: 15px; font-family: 'TH Sarabun PSK', sans-serif; border: 1px solid #ddd; }
        .report-header { text-align: left; font-size: 16pt; font-weight: bold; margin-bottom: 10px; }
        table.report-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        table.report-table th, table.report-table td { border: 1px solid #000; padding: 4px 8px; font-size: 13pt; }
        table.report-table th { text-align: center; background-color: #f9f9f9; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .font-bold { font-weight: bold; }
        .total-summary { text-align: right; font-size: 14pt; font-weight: bold; margin-top: 15px; }

        /* ปุ่มลบรายการรายบรรทัด */
        .btn-del-item { 
            background: #e53935; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            padding: 2px 6px; 
            font-size: 11px; 
            cursor: pointer; 
            margin-left: 8px; 
        }

        .no-data { text-align: center; color: #888; padding: 20px !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">DocTrack Pro - บันทึกงานส่งเอกสาร</div>
    
    <div class="user-box">
        <div>ผู้ใช้งานปัจจุบัน: <span id="current-user-display" style="font-weight:bold;">โอภาส</span></div>
        <div class="user-btns">
            <button class="btn-user active" onclick="setUser('โอภาส')">โอภาส</button>
            <button class="btn-user" onclick="setUser('นรินทร์')">นรินทร์</button>
            <button class="btn-user" onclick="setUser('เจริญชัย')">เจริญชัย</button>
            <button class="btn-user" onclick="setUser('ต้น')">ต้น</button>
        </div>
    </div>

    <div class="tab-btns">
        <button class="btn-tab active" id="tab-form-btn" onclick="switchTab('form')">✏️ ลงงาน</button>
        <button class="btn-tab" id="tab-report-btn" onclick="switchTab('report')">📄 รายงาน A4</button>
    </div>

    <!-- ฟอร์มลงงาน -->
    <div id="tab-form">
        <div class="form-group">
            <label>วัน/เดือน/ปี</label>
            <input type="date" id="doc-date">
        </div>
        <div class="form-group">
            <label>รายการ / สถานที่</label>
            <input type="text" id="doc-location" placeholder="เช่น ไปรษณีย์, ปากคลองตลาด">
        </div>
        <div class="form-group">
            <label>เวลา (เริ่ม - จบ)</label>
            <input type="text" id="doc-time" placeholder="เช่น 09.30-09.55 น.">
        </div>
        <div class="form-group">
            <label>จำนวนเงิน (บาท)</label>
            <input type="number" id="doc-amount" placeholder="เช่น 40">
        </div>
        <button class="btn-submit" onclick="saveData()">บันทึกข้อมูล</button>
    </div>

    <!-- หน้ารายงาน -->
    <div id="tab-report" style="display:none;">
        <div class="action-bar">
            <button class="btn-action btn-print" onclick="downloadPDF()">🖨️ โหลด PDF</button>
            <button class="btn-action btn-clear-all" onclick="clearUserRecords()">🗑️ ล้างทั้งหมด</button>
        </div>

        <div id="pdf-content" class="report-page">
            <div class="report-header">ชื่อ นาย<span id="rpt-user-name">โอภาส</span></div>
            <table class="report-table">
                <thead>
                    <tr>
                        <th style="width: 22%;">วันเดือน/ปี</th>
                        <th style="width: 43%;">รายการ / สถานที่</th>
                        <th style="width: 20%;">เวลา</th>
                        <th style="width: 15%;">จำนวนเงิน</th>
                    </tr>
                </thead>
                <tbody id="report-table-body"></tbody>
            </table>
            <div class="total-summary">
                TOTAL <span id="grand-total" style="margin-left: 30px; text-decoration: underline;">0.-</span>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = 'โอภาส';

    // ฟังก์ชันคำนวณและรีเซ็ตข้อมูลเมื่อเข้าสู่รอบวันที่ 24
    function checkAndResetCycle() {
        const today = new Date();
        let year = today.getFullYear();
        let month = today.getMonth() + 1;
        if (today.getDate() >= 24) month += 1;
        
        const currentCycle = `${year}-${String(month).padStart(2, '0')}`;
        const savedCycle = localStorage.getItem('doc_current_cycle');

        if (savedCycle && savedCycle !== currentCycle) {
            localStorage.removeItem('doc_records');
        }
        localStorage.setItem('doc_current_cycle', currentCycle);
    }

    checkAndResetCycle();
    let records = JSON.parse(localStorage.getItem('doc_records') || '[]');
    document.getElementById('doc-date').valueAsDate = new Date();

    function setUser(name) {
        currentUser = name;
        document.getElementById('current-user-display').innerText = name;
        document.querySelectorAll('.btn-user').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === name);
        });
        renderReport();
    }

    function switchTab(tab) {
        if(tab === 'form') {
            document.getElementById('tab-form').style.display = 'block';
            document.getElementById('tab-report').style.display = 'none';
            document.getElementById('tab-form-btn').classList.add('active');
            document.getElementById('tab-report-btn').classList.remove('active');
        } else {
            document.getElementById('tab-form').style.display = 'none';
            document.getElementById('tab-report').style.display = 'block';
            document.getElementById('tab-report-btn').classList.add('active');
            document.getElementById('tab-form-btn').classList.remove('active');
            renderReport();
        }
    }

    function saveData() {
        const dateInput = document.getElementById('doc-date').value;
        const location = document.getElementById('doc-location').value;
        const time = document.getElementById('doc-time').value;
        const amount = document.getElementById('doc-amount').value;

        if(!dateInput || !location || !amount) {
            alert('กรุณากรอกข้อมูลให้ครบถ้วน');
            return;
        }

        const d = new Date(dateInput);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = String(d.getFullYear() + 43).slice(-2);

        records.push({
            id: Date.now(),
            user: currentUser,
            date: `${day}/${month}/${year}`,
            location: location,
            time: time,
            amount: parseFloat(amount)
        });

        localStorage.setItem('doc_records', JSON.stringify(records));
        alert('บันทึกสำเร็จ');
        
        document.getElementById('doc-location').value = '';
        document.getElementById('doc-time').value = '';
        document.getElementById('doc-amount').value = '';
    }

    function deleteItem(id) {
        if(confirm('ลบรายการนี้หรือไม่?')) {
            records = records.filter(item => item.id !== id);
            localStorage.setItem('doc_records', JSON.stringify(records));
            renderReport();
        }
    }

    function clearUserRecords() {
        if(confirm(`ต้องการลบข้อมูลทั้งหมดของ "${currentUser}" หรือไม่?`)) {
            records = records.filter(item => item.user !== currentUser);
            localStorage.setItem('doc_records', JSON.stringify(records));
            renderReport();
        }
    }

    function renderReport() {
        document.getElementById('rpt-user-name').innerText = currentUser;
        const tbody = document.getElementById('report-table-body');
        tbody.innerHTML = '';

        const userRecords = records.filter(r => r.user === currentUser);
        
        if (userRecords.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="no-data">ยังไม่มีข้อมูลในระบบ</td></tr>`;
            document.getElementById('grand-total').innerText = '0.-';
            return;
        }

        const grouped = {};
        userRecords.forEach(r => {
            if(!grouped[r.date]) grouped[r.date] = [];
            grouped[r.date].push(r);
        });

        let grandTotal = 0;

        for (const date in grouped) {
            const items = grouped[date];
            let dayTotal = 0;

            items.forEach((item, index) => {
                const tr = document.createElement('tr');
                dayTotal += item.amount;
                grandTotal += item.amount;

                tr.innerHTML = `
                    <td class="text-center">${index === 0 ? date : ''}</td>
                    <td>
                        ${index + 1}. ${item.location}
                        <button class="btn-del-item" onclick="deleteItem(${item.id})">ลบ</button>
                    </td>
                    <td class="text-center">${item.time}</td>
                    <td class="text-right">${item.amount}.-</td>
                `;
                tbody.appendChild(tr);
            });

            const totalTr = document.createElement('tr');
            totalTr.innerHTML = `
                <td></td>
                <td></td>
                <td class="text-center font-bold">TOTAL</td>
                <td class="text-right font-bold" style="text-decoration: underline;">${dayTotal}.-</td>
            `;
            tbody.appendChild(totalTr);
        }

        document.getElementById('grand-total').innerText = `${grandTotal.toLocaleString()}.-`;
    }

    function downloadPDF() {
        const delBtns = document.querySelectorAll('.btn-del-item');
        delBtns.forEach(b => b.style.display = 'none');

        const element = document.getElementById('pdf-content');
        const opt = {
          margin: 0.5,
          filename: `รายงาน_${currentUser}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            delBtns.forEach(b => b.style.display = 'inline-block');
        });
    }
</script>

</body>
</html>
